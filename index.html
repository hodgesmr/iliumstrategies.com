        /* A typed page: one size, one weight, 60 characters to the line. */

                    #353029 7ch 8ch,
                    #1d1915 8ch 11ch,
                    #2f2a24 11ch 12ch,

        /* A point on the baseline to hang a mark from. */
        .at {
            position: relative;
            display: inline-block;
            width: 0;
            height: 0;
            text-indent: 0;
        }

        .at svg {
            position: absolute;
            top: -1.25em;
            left: 0;
            width: 8ch;
            height: 1.9em;
            overflow: visible;
        }

        .edit {
            position: relative;
            display: inline-block;
            text-indent: 0;
        }

        .edit del {
            text-decoration: none;
        }

        .edit ins,
        .aside {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
        }

        .edit svg {
            position: absolute;
            top: -0.5em;
            left: -0.5ch;
            width: 5ch;
            height: 2.2em;
            overflow: visible;
        }

        .marked {
            position: relative;
        }

        /* Drawn in units of 1/20 em, so the marks follow the type: 12 units to the character, 38 to the line. */
        .swap {
            position: absolute;
            top: 0;
            left: 5ch;
            width: 12ch;
            height: 2em;
            overflow: visible;
            pointer-events: none;
        }

        .tall {
            display: none;
        }

        .mark {
            fill: var(--pencil);
        }

        /* Player piano */
        .piano {
            display: block;
            width: min(341px, 93%);
            height: auto;
            margin: 30px auto 36px;
            overflow: visible;
        }

        .line,
        .fine,
        .heavy {
            fill: none;
            stroke: var(--ink);
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .pedals {
            fill: var(--paper);
        }

        .fine {
            stroke-width: 1.6;
        }

        .heavy {
            stroke-width: 3.3;
        }

        .solid {
            fill: var(--ink);
        }

        /* The roll advances ten rows (80 units) per turn; each key's keyframes are the rows punched in its channel. */
        .roll,
        .key {
            animation: 12s linear infinite;
        }

        .roll {
            animation-name: roll;
        }

        .key-1,
        .key-2 {
            animation-name: channel-1-2;
        }

        .key-3 {
            animation-name: channel-3;
        }

        .key-4 {
            animation-name: channel-4;
        }

        .key-5 {
            animation-name: channel-5;
        }

        @keyframes roll {
            to {
                transform: translateY(80px);
            }
        }

        @keyframes channel-1-2 {
            0%, 1.25%, 9.5%, 31.25%, 39.5%, 71.25%, 79.5%, 100% {
                transform: none;
            }

            2%, 8.75%, 32%, 38.75%, 72%, 78.75% {
                transform: translateY(4px);
            }
        }

        @keyframes channel-3 {
            0%, 1.25%, 19.5%, 41.25%, 59.5%, 100% {
                transform: none;
            }

            2%, 18.75%, 42%, 58.75% {
                transform: translateY(4px);
            }
        }

        @keyframes channel-4 {
            0%, 1.25%, 29.5%, 61.25%, 69.5%, 100% {
                transform: none;
            }

            2%, 28.75%, 62%, 68.75% {
                transform: translateY(4px);
            }
        }

        @keyframes channel-5 {
            0%, 21.25%, 39.5%, 51.25%, 79.5%, 100% {
                transform: none;
            }

            22%, 38.75%, 52%, 78.75% {
                transform: translateY(4px);
            }
        }

        /* Below 41 characters the last sentence needs two lines, so choose the break. */
        @media (max-width: 460px) {
            .narrow {
                display: inline;
            }

            figcaption {
                padding-left: min(12ch, 100% - 15ch);
            }

            .wide {
                display: none;
            }

            .tall {
                display: inline;
            }

            .second {
                transform: translate(-240px, 38px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            /* Hold still mid-note, so the holes and the keys still agree. */
            .roll,
            .key {
                animation-play-state: paused;
                animation-delay: -0.5s;
            }
        }

        @media print, (forced-colors: active) {
            .ink {
                background: none;
                -webkit-text-fill-color: currentColor;
            }
        }
    </style>
